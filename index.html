<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><title>Driver Transport</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#17212b;font-family:Arial,Helvetica,sans-serif}button{font:inherit;border:0;cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 28px #0001}.top{background:#17324d;color:#fff;padding:22px 20px 20px}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;font-size:15px;opacity:.85}.screen{padding:20px}.vehicle{display:flex;justify-content:space-between;align-items:center;background:#f2f5f7;border-radius:16px;padding:18px;margin-bottom:18px}.vehicle small{display:block;color:#65727d;margin-bottom:5px}.reg{font-weight:800;font-size:26px;letter-spacing:1px;background:none;padding:0;color:#17324d}.homebtn{width:100%;padding:24px 18px;margin:9px 0;border-radius:16px;background:#f1f4f6;text-align:left;font-size:21px;font-weight:700;color:#17212b}.homebtn span{float:right;font-size:28px}.back{background:none;padding:0 0 16px;color:#17324d;font-weight:700;font-size:16px}.card{border:1px solid #dbe1e6;border-radius:16px;padding:18px;margin:12px 0}.card h2{font-size:20px;margin:0 0 8px}.muted{color:#66737d}.choice{width:100%;padding:22px;margin:8px 0;border-radius:15px;background:#f1f4f6;font-size:20px;font-weight:700;text-align:left}.question{font-size:23px;line-height:1.3;font-weight:700;margin:24px 0 28px}.yesno{display:grid;grid-template-columns:1fr 1fr;gap:12px}.yesno button{padding:25px 10px;border-radius:15px;font-size:22px;font-weight:800}.yes{background:#dff2e5}.no{background:#f9dfdf}.job{padding:18px;border:1px solid #d9e0e5;border-radius:16px;margin:12px 0}.jobhead{display:flex;justify-content:space-between;gap:10px}.badge{font-size:13px;font-weight:800;padding:7px 9px;border-radius:10px;background:#e8edf1;white-space:nowrap}.live{background:#dff2e5}.job h3{margin:5px 0 10px;font-size:21px}.job p{margin:7px 0}.detailrow{padding:12px 0;border-bottom:1px solid #e8ecef}.detailrow:last-child{border-bottom:0}.primary{width:100%;padding:20px;border-radius:15px;background:#17324d;color:#fff;font-size:20px;font-weight:800;margin-top:15px}.secondary{width:100%;padding:17px;border-radius:15px;background:#eef2f5;color:#17324d;font-size:18px;font-weight:700;margin-top:10px}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #dfe4e8;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{padding:15px;border-radius:12px;background:#f0f3f5;font-weight:700}.nav button.active{background:#17324d;color:#fff}.planner .homebtn{background:#eaf0f5}.success{background:#e4f5e9;border-radius:15px;padding:18px;font-weight:700}.warning{background:#fff1d8;border-radius:15px;padding:18px;font-weight:700}textarea{width:100%;min-height:110px;border:1px solid #cfd7de;border-radius:12px;padding:14px;font:inherit;font-size:17px}.hidden{display:none!important}
</style></head><body><div class="app" id="app"></div><script>
const app=document.getElementById('app');let screen='home', checkType='',q=0,defects=[],jobs=[{id:'10482',title:'Customer Delivery',status:'LIVE',from:'GT Towing, Hatfield',to:'Blains Tyres & Trailers',customer:'Blains Tyres & Trailers',goods:'Trailer',time:'Required 10:30',issued:'Today 06:15',instructions:'Report to reception and follow site instructions.'},{id:'10491',title:'Trailer Movement',status:'PENDING',from:'Yard 1',to:'Yard 2',customer:'Internal',goods:'Trailer 1234',time:'Tomorrow 08:00',issued:'Today 14:20',instructions:'Move trailer to Yard 2 and leave in designated bay.'}];
const sets={cab:['Are the warning lights and gauges working correctly?','Are the seat, seat belt and mirrors secure and working?','Is the windscreen and visibility clear?','Are the wipers, washers and demister working?','Is the cab free from anything that could affect safe driving?'],unit:['Are all tyres safe?','Are all lights and indicators working?','Are the mirrors, glass and bodywork safe?','Are the number plates secure and visible?','Are the brakes, air lines and connections safe?'],trailer:['Are all trailer tyres safe?','Are all trailer lights and indicators working?','Is the trailer bodywork and equipment safe?','Are the trailer number plates secure and visible?','Are the trailer brakes, air lines and connections safe?','Is the trailer coupling secure and safe?'],combined:['Are all unit and trailer tyres safe?','Are all unit and trailer lights and indicators working?','Are the unit and trailer mirrors, glass and bodywork safe?','Are the unit and trailer number plates secure and visible?','Are the unit and trailer brakes, air lines and connections safe?','Is the trailer coupling secure and safe?']};
function header(title,sub=''){return `<div class="top"><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>`}function back(){return `<button class="back" onclick="go('home')">‹ Back</button>`}function render(){let html='';if(screen==='home')html=header('Hello Ryan','Driver Transport')+`<div class="screen"><div class="vehicle"><div><small>Vehicle driving</small><button class="reg" onclick="vehicle()">AB12 XYZ</button></div><span>›</span></div><button class="homebtn" onclick="go('jobs')">Jobs Allocated <span>›</span></button><button class="homebtn" onclick="go('check')">Walk-Around Checks <span>›</span></button><button class="homebtn" onclick="go('planner')">Planner Demo <span>›</span></button></div>`;
else if(screen==='check')html=header('Walk-Around Checks')+`<div class="screen">${back()}<button class="choice" onclick="start('unit')">UNIT ONLY</button><button class="choice" onclick="start('combined')">UNIT + TRAILER</button><button class="choice" onclick="start('trailer')">TRAILER ONLY</button></div>`;
else if(screen==='question')html=header('Walk-Around Check',`${q+1} of ${sets[checkType].length}`)+`<div class="screen">${back()}<div class="card"><div class="muted">${checkType==='cab'?'IN CAB':checkType==='combined'?'UNIT + TRAILER':'OUTSIDE'}</div><div class="question">${sets[checkType][q]}</div><div class="yesno"><button class="yes" onclick="answer(true)">YES</button><button class="no" onclick="answer(false)">NO</button></div></div></div>`;
else if(screen==='defect')html=header('Defect')+`<div class="screen">${back()}<div class="card"><h2>What is wrong?</h2><p class="muted">${sets[checkType][q]}</p><textarea id="def" placeholder="Describe the defect"></textarea><button class="secondary" onclick="addDefect()">Save defect</button></div></div>`;
else if(screen==='done')html=header('Check Complete')+`<div class="screen">${back()}<div class="success">Walk-around check recorded.</div>${defects.length?`<div class="card"><h2>Defects recorded</h2>${defects.map(x=>`<p>• ${x}</p>`).join('')}</div>`:''}<button class="primary" onclick="go('home')">Done</button></div>`;
else if(screen==='jobs')html=header('Jobs Allocated','Jobs dispatched to you')+`<div class="screen">${back()}${jobs.map((j,i)=>`<button class="job" style="width:100%;text-align:left;background:#fff" onclick="job(${i})"><div class="jobhead"><span class="badge ${j.status==='LIVE'?'live':''}">${j.status}</span><span class="muted">${j.time}</span></div><h3>Job ${j.id} — ${j.title}</h3><p><b>${j.from}</b> → <b>${j.to}</b></p></button>`).join('')}</div>`;
else if(screen==='job')html=header('Job '+jobs[window.j].id,jobs[window.j].status)+`<div class="screen">${back()}<div class="card"><div class="detailrow"><b>Customer</b><br>${jobs[window.j].customer}</div><div class="detailrow"><b>Collection</b><br>${jobs[window.j].from}</div><div class="detailrow"><b>Delivery</b><br>${jobs[window.j].to}</div><div class="detailrow"><b>Goods</b><br>${jobs[window.j].goods}</div><div class="detailrow"><b>Time</b><br>${jobs[window.j].time}</div><div class="detailrow"><b>Instructions</b><br>${jobs[window.j].instructions}</div><div class="detailrow"><b>Dispatched by</b><br>Transport Planner · ${jobs[window.j].issued}</div></div>${jobs[window.j].status==='LIVE'?'<button class="primary" onclick="completeJob()">Complete Job</button>':''}</div>`;
else if(screen==='planner')html=header('Planner Demo','Authorised users only')+`<div class="screen">${back()}<div class="card"><h2>Dispatch a job</h2><p class="muted">Demonstration of how a Transport Planner sends a job to a driver.</p><button class="primary" onclick="dispatch()">Dispatch Job 10503 to Ryan</button></div><div class="card"><h2>Trailer location</h2><p><b>Trailer 1234</b></p><p class="muted">Last recorded: Yard 1 · Ryan · Today 16:42</p><button class="secondary" onclick="alert('Movement history would appear here in the full system.')">View movement history</button></div></div>`;
app.innerHTML=html}
function go(s){screen=s;render()}function start(t){checkType=t;defects=[];q=0;if(t==='unit'){checkType='cab';}else if(t==='combined'){checkType='cab'}screen='question';render()}function answer(ok){if(!ok){screen='defect';render();return}if(q<sets[checkType].length-1){q++;render();return}if(checkType==='cab'&&checkType!=='trailer'){checkType=(window.initialType==='combined'?'combined':'unit');}else if(window.initialType==='unit'&&checkType==='unit'){screen='done';render();return}else if(window.initialType==='combined'&&checkType==='combined'){screen='done';render();return}else if(window.initialType==='trailer'&&checkType==='trailer'){screen='done';render();return}q=0;screen='question';render()}function addDefect(){let x=document.getElementById('def').value.trim();if(x)defects.push(x);if(checkType==='cab'){checkType=window.initialType==='combined'?'combined':'unit';q=0;screen='question'}else{screen='question'}render()}function vehicle(){alert('Vehicle selection: choose a vehicle from the company fleet. Current vehicle: AB12 XYZ')}function job(i){window.j=i;screen='job';render()}function completeJob(){jobs[window.j].status='COMPLETED';render()}function dispatch(){if(!jobs.find(x=>x.id==='10503'))jobs.unshift({id:'10503',title:'Customer Collection',status:'LIVE',from:'Company Yard',to:'Customer Site',customer:'Demo Customer',goods:'4 pallets',time:'Today 17:30',issued:'Now',instructions:'Collect 4 pallets. Driver instructions attached.'});alert('Job 10503 dispatched to Ryan. It now appears under Jobs Allocated.');go('jobs')}
window.initialType='';const oldStart=start;start=function(t){window.initialType=t;oldStart(t)};render();
</script></body></html>
